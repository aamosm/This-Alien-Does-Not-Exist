<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Alien Doesn't Exist</title>

  <style>
    :root{
      --bg:#0a0a0a;
      --panel:#121212;
      --canvas-bg:#161616;
      --text:#aaa;
      --muted:#777;
      --border:#2e2e2e;
      --border-hover:#4a4a4a;
      --shadow:0 12px 44px rgba(0,0,0,.55);

      --page-pad: clamp(12px, 2.4vw, 28px);
      --col-gap: clamp(18px, 3vw, 44px);
      --panel-w: clamp(250px, 28vw, 340px);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .page {
      min-height: 100svh;
      padding: var(--page-pad);
      display: grid;
      place-items: center;
    }

    .layout {
      width: min(1200px, 100%);
      display: grid;
      grid-template-columns: minmax(320px, 1fr) var(--panel-w);
      gap: var(--col-gap);
      align-items: center;
    }

    .canvas-wrap {
      width: 100%;
      display: grid;
      place-items: center;
    }

    canvas {
      width: min(100%, 78svh);
      max-width: 820px;
      aspect-ratio: 1 / 1;
      height: auto;
      display: block;
      background: var(--canvas-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .08s ease;
    }

    canvas:active {
      transform: scale(0.995);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(12px, 1.8vw, 18px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-self: stretch;
      justify-content: space-between;
      min-height: min(78svh, 820px);
    }

    #alienData {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      word-break: break-word;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, button {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1a1a1a;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--border-hover);
    }

    button {
      background: #222;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }

    button:hover {
      background: #303030;
      border-color: #5a5a5a;
      color: #fff;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      canvas {
        width: min(100%, 82vw);
        max-width: 620px;
      }

      .panel {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="layout">
      <div class="canvas-wrap">

        <canvas id="alienCanvas" width="700" height="700" title="Click to generate random"></canvas>
      </div>

      <aside class="panel">
        <div id="alienData">Loading Aliens</div>

        <div class="controls">
          <input type="text" id="seedInput" placeholder="Custom Seed..." inputmode="numeric" />
          <button id="generateBtn">Load</button>
          <div class="hint">Tip: click the alien to go to a random one</div>
        </div>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    const BASE_PATH = window.location.pathname
    .replace(/\/+$/, "")
    .replace(/\/[^/]*$/, "");
    const SEED_LENGTH = 12;

    function normalizeSeedString(seedLike) {
      const s = String(seedLike ?? "").trim();
      const digits = s.replace(/\D/g, "");
      if (!digits) return null;
      return digits.replace(/^0+/, "") || "0";
    }

    function displaySeed(seed) {
      return String(seed).padStart(SEED_LENGTH, "0");
    }

    function randomSeedString() {
      const n = Math.floor(Math.random() * 1_000_000_000_000);
      return String(n);
    }

    function extractSeedFromPath(pathname) {
      let p = pathname;
      if (p.startsWith(BASE_PATH)) p = p.slice(BASE_PATH.length);
      p = p.replace(/^\/+|\/+$/g, "");
      if (!p) return null;
      return normalizeSeedString(p.split("/")[0]);
    }

    function getSeedFromRedirectParam() {
      const params = new URLSearchParams(window.location.search);
      const p = params.get("p");
      if (!p) return null;
      try {
        const decoded = decodeURIComponent(p);
        return extractSeedFromPath(decoded);
      } catch {
        return null;
      }
    }

    function updateURL(seed, push = false) {
      const url = `${BASE_PATH}/${seed}`; // short URL ok
      const state = { seed };
      if (push) history.pushState(state, "", url);
      else history.replaceState(state, "", url);
    }

    function renderAlien(canvasId, seed) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return null;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const numSeed = parseInt(seed, 10);
      const alien = generateAlien(numSeed);

      const allBones = alien.geometry.allBones;
      const head = alien.geometry.head;
      const [baseR, baseG, baseB] = alien.materials.baseColorRGB;
      const scale = fitToBounds(allBones, head, canvas.width, canvas.height, 60);
      const k = alien.materials.smoothingK * scale;

      const imgData = ctx.createImageData(canvas.width, canvas.height);
      const data = imgData.data;
      const eps = 1.0;

      for (let py = 0; py < canvas.height; py++) {
        for (let px = 0; px < canvas.width; px++) {
          const d = evaluateField(px, py, allBones, k);
          if (d < 1.0) {
            const idx = (py * canvas.width + px) * 4;
            const alpha = Math.max(0, Math.min(1, 1.0 - d));
            const dx = evaluateField(px + eps, py, allBones, k) - d;
            const dy = evaluateField(px, py + eps, allBones, k) - d;
            const nz = 1.5;
            const nLen = Math.hypot(dx, dy, nz);
            const nx = dx / nLen, ny = dy / nLen, normZ = nz / nLen;
            const lx = -0.5, ly = -0.5, lz = 0.8;
            const dot = Math.max(0, nx * lx + ny * ly + normZ * lz);
            const intensity = 0.25 + dot * 0.75;

            data[idx] = Math.min(255, baseR * intensity);
            data[idx + 1] = Math.min(255, baseG * intensity);
            data[idx + 2] = Math.min(255, baseB * intensity);
            data[idx + 3] = alpha * 255;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);

      const n = alien.genome.eyeCount;
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0.5 : i / (n - 1);
        const spread = head.headR * 1.1;
        const ex = head.headCenter.x + (t - 0.5) * spread;
        const ey = head.headCenter.y - head.headR * 0.15;
        ctx.fillStyle = "rgba(10,10,10,0.9)";
        ctx.beginPath();
        ctx.arc(ex, ey, Math.max(1.5, head.headR * 0.09), 0, Math.PI * 2);
        ctx.fill();
      }

      return alien;
    }

    function updateInfo(alien, seed) {
      document.getElementById("alienData").innerHTML = `
        <span style="color:#fff">Seed:</span> ${displaySeed(seed)}<br>
        <span style="color:#fff">Size:</span> ${alien.facts.size} &nbsp;|&nbsp;
        <span style="color:#fff">Diet:</span> ${alien.facts.diet}<br>
        <span style="color:#fff">Locomotion:</span> ${alien.facts.locomotion} &nbsp;|&nbsp;
        <span style="color:#fff">Temperament:</span> ${alien.facts.temperament}
      `;
    }

    function newAlien(mode = "input", urlSeed = null) {
      const dataEl = document.getElementById("alienData");
      const input = document.getElementById("seedInput");
      dataEl.textContent = "Generating SDF... please wait.";

      setTimeout(() => {
        let seed = null;

        if (urlSeed != null) seed = normalizeSeedString(urlSeed);
        else if (mode === "random") seed = randomSeedString();
        else seed = normalizeSeedString(input.value) || randomSeedString();

        input.value = displaySeed(seed);

        const push = mode === "random";
        updateURL(seed, push);

        const alien = renderAlien("alienCanvas", seed);
        updateInfo(alien, seed);
      }, 20);
    }

    window.addEventListener("load", () => {
      const seedFromUrl =
        extractSeedFromPath(window.location.pathname) ||
        getSeedFromRedirectParam();

      if (seedFromUrl) newAlien("url", seedFromUrl);
      else newAlien("random");
    });

    window.addEventListener("popstate", (event) => {
      if (event.state && event.state.seed) {
        newAlien("url", event.state.seed);
        return;
      }
      const seedFromUrl =
        extractSeedFromPath(window.location.pathname) ||
        getSeedFromRedirectParam();

      if (seedFromUrl) newAlien("url", seedFromUrl);
      else newAlien("random");
    });

    document.getElementById("generateBtn").addEventListener("click", () => newAlien("input"));

    document.getElementById("seedInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        newAlien("input");
        this.blur();
      }
    });

    document.getElementById("alienCanvas").addEventListener("click", () => {
      document.getElementById("seedInput").value = "";
      newAlien("random");
    });
  </script>
</body>
</html>
