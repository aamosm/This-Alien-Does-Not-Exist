<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This Alien Doesn't Exist</title>

  <style>
    :root{
      --bg:#0a0a0a;
      --panel:#121212;
      --canvas-bg:#161616;
      --text:#aaa;
      --muted:#777;
      --border:#2e2e2e;
      --border-hover:#4a4a4a;
      --shadow:0 12px 44px rgba(0,0,0,.55);

      --page-pad: clamp(12px, 2.4vw, 28px);
      --col-gap: clamp(18px, 3vw, 44px);
      --panel-w: clamp(250px, 28vw, 360px);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .page {
      min-height: 100svh;
      padding: var(--page-pad);
      display: grid;
      place-items: center;
    }

    .layout {
      width: min(1200px, 100%);
      display: grid;
      grid-template-columns: minmax(320px, 1fr) var(--panel-w);
      gap: var(--col-gap);
      align-items: flex-start;
    }

    .canvas-wrap {
      width: 100%;
      display: grid;
      place-items: center;
      position: sticky;
      top: var(--page-pad);
      padding-top: 5%;
      padding-bottom: 5%;
    }

    canvas {
      width: min(100%, 78svh);
      max-width: 820px;
      aspect-ratio: 1 / 1;
      height: auto;
      display: block;
      background: var(--canvas-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .08s ease;
    }

    canvas:active {
      transform: scale(0.995);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(12px, 1.8vw, 18px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-self: stretch;
      min-height: min(78svh, 820px);
    }

    #alienData {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      word-break: break-word;
      flex-grow: 1;
      overflow-y: auto;
      padding-right: 8px;
    }
    
    #alienData::-webkit-scrollbar {
      width: 6px;
    }
    #alienData::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .data-section {
      margin-bottom: 16px;
    }
    
    .data-header {
      color: #fff;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      display: block;
      cursor: pointer;
      user-select: none;
    }

    .data-header .chev {
      display: inline-block;
      width: 1.2em;
    }

    .section-body {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows .16s ease, opacity .16s ease;
    }

    .section-body.collapsed {
      grid-template-rows: 0fr;
      opacity: 0;
    }

    .section-body-inner {
      overflow: hidden;
      min-height: 0;
    }

    .data-entry {
      margin-bottom: 10px;
    }
    
    .entry-label {
      color: #ddd;
    }

    .entry-confidence {
      color: var(--muted);
      margin-right: 4px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    input, button {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #1a1a1a;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--border-hover);
    }

    button {
      background: #222;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }

    button:hover {
      background: #303030;
      border-color: #5a5a5a;
      color: #fff;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .seed-row {
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap: wrap;
    }

    .copy-btn {
      width: auto;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid var(--border);
      background:#1d1d1d;
      color:#fff;
      cursor:pointer;
      line-height: 0;
      transition: background .15s ease, border-color .15s ease, transform .1s ease;
    }

    .copy-btn:hover {
      background:#2a2a2a;
      border-color:#5a5a5a;
      color:#fff;
    }

    .copy-btn.copied {
      color:#000;
      border-color:#fff;
      background:#fff;
    }

    .seed-link {
      color: #9ec1ff;
      cursor: pointer;
      text-decoration: underline;
    }

    .seed-link:hover {
      color: #c7dbff;
    }

    .registry-id {
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .canvas-wrap {
        position: static;
      }
      canvas {
        width: min(100%, 82vw);
        max-width: 620px;
      }
      .panel {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="layout">
      <div class="canvas-wrap">
        <canvas id="alienCanvas" width="700" height="700" title="Click to load another entity"></canvas>
      </div>

      <aside class="panel">
        <div id="alienData">Accessing telemetry...</div>

        <div class="controls">
          <input type="text" id="seedInput" placeholder="Custom Seed..." inputmode="numeric" />
          <button id="generateBtn">Load</button>
          <div class="hint">Click the entity to discover another.</div>
        </div>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="registry.js"></script>
  <script src="observations.js"></script>
  <script>
    const BASE_PATH = "";
    const MAX_SEED = 4294967295; 
    const HUMAN_SEED = MAX_SEED + 1; // That Sounds So Wrong
    const SEED_LENGTH = 10;
    const LOCAL_DB_SIZE = 120;
    
    let localDB = [];
    let dbInitialized = false;
    let currentRenderedSeed = null;
    const COLLAPSE_KEY = "taDE.collapsedSections";

    const COPY_ICON = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const CHECK_ICON = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    function getCollapsedState() {
      try {
        const raw = localStorage.getItem(COLLAPSE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }

    function setCollapsedState(state) {
      try {
        localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state || {}));
      } catch {}
    }

    function toggleSection(sectionName) {
      const state = getCollapsedState();
      const collapsed = !state[sectionName];
      state[sectionName] = collapsed;
      setCollapsedState(state);
      const header = document.querySelector(`[data-toggle-section="${CSS.escape(sectionName)}"]`);
      if (!header) return;
      const chevEl = header.querySelector(".chev");
      const body = header.nextElementSibling;
      if (chevEl) chevEl.textContent = collapsed ? "▶" : "▼";
      if (body) body.classList.toggle("collapsed", collapsed);
    }

    function resizeCanvasToDisplaySize(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function smartPadding(alien, canvas) {
      const b = (alien && alien.geometry && alien.geometry.allBones) ? alien.geometry.allBones : [];
      if (!b.length) return Math.round(Math.min(canvas.width, canvas.height) * 0.12);
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of b) {
        if (!p || typeof p.bounds !== "function") continue;
        const bb = p.bounds();
        minX = Math.min(minX, bb.minX); minY = Math.min(minY, bb.minY);
        maxX = Math.max(maxX, bb.maxX); maxY = Math.max(maxY, bb.maxY);
      }
      const w = Math.max(1, maxX - minX);
      const h = Math.max(1, maxY - minY);
      const aspect = h / w;
      const base = Math.min(canvas.width, canvas.height);
      let pct = 0.13;
      if (aspect > 1.35) pct = 0.16;
      if (aspect < 0.75) pct = 0.14;
      return clamp(Math.round(base * pct), 48, 110);
    }

    function makeSeedLink(seed) {
      return `<span class="seed-link" data-seed-link="${seed}">${displaySeed(seed)}</span>`;
    }

    function prepareEntity(alien, numSeed) {
        alien.seed = numSeed; 
        
        if (!alien.physicalVector) {
            alien.physicalVector = (alien.trace && alien.trace.derived && alien.trace.derived.physicalVector) 
                ? Array.from(alien.trace.derived.physicalVector) 
                : new Array(15).fill(0);
        }
        
        if (!alien.behaviourVector && typeof RegistryEngine !== 'undefined') {
            try {
                alien.behaviourVector = RegistryEngine.buildBehaviourVector(alien);
            } catch (e) {
                alien.behaviourVector = { keys: [], vector: [] };
            }
        }
        return alien;
    }

    function initializeLocalDB() {
      if (dbInitialized) return;
      for (let i = 0; i < LOCAL_DB_SIZE; i++) {
        const s = Math.floor(detHash(0xA11E1, "local-db-" + i) * (MAX_SEED + 1));
        try {
            const alien = AlienEngine.generate(s);
            localDB.push(prepareEntity(alien, s));
        } catch (e) {}
      }
      dbInitialized = true;
    }

    function detHash(seed, salt) {
      let h = (seed >>> 0);
      for(let i = 0; i < salt.length; i++) {
        h = Math.imul(h ^ salt.charCodeAt(i), 2654435761) >>> 0;
      }
      return (h >>> 0) / 4294967296;
    }

    function pickDet(seed, salt, array) {
      if (!array || array.length === 0) return null;
      const idx = Math.floor(detHash(seed, salt) * array.length);
      return array[idx];
    }

    function selectN(seed, salt, pool, count) {
      let available = [...pool];
      let selected = [];
      for (let i = 0; i < count && available.length > 0; i++) {
          let idx = Math.floor(detHash(seed, salt + i) * available.length);
          selected.push(available.splice(idx, 1)[0]);
      }
      return selected;
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    function getConf(certitude) {
        if (typeof certitude === 'string') return `[${certitude.toUpperCase()}]`;
        if (certitude >= 0.75) return "[OBSERVED]";
        if (certitude >= 0.45) return "[LIKELY]";
        return "[POSSIBLE]";
    }

    // URL
    function normalizeSeedString(seedLike) {
      const s = String(seedLike ?? "").trim();
      const digits = s.replace(/\D/g, "");
      if (!digits) return null;

      const n = Math.min(parseInt(digits, 10) || 0, HUMAN_SEED);
      return String(n);
    }

    function displaySeed(seed) {
      return String(seed).padStart(SEED_LENGTH, "0");
    }

    function randomSeedString() {
      const HUMAN_CHANCE = 1 / 10000;

      if (Math.random() < HUMAN_CHANCE) {
          return String(MAX_SEED + 1);
      }

      if (window.crypto && window.crypto.getRandomValues) {
          const arr = new Uint32Array(1);
          window.crypto.getRandomValues(arr);
          return String(arr[0] % (MAX_SEED + 1));
      }

      return String(Math.floor(Math.random() * (MAX_SEED + 1)));
    }

    function extractSeedFromPath(pathname) {
      let p = pathname;
      if (p.startsWith(BASE_PATH)) p = p.slice(BASE_PATH.length);
      p = p.replace(/^\/+|\/+$/g, "");
      if (!p) return null;
      return normalizeSeedString(p.split("/")[0]);
    }

    function getSeedFromRedirectParam() {
      const params = new URLSearchParams(window.location.search);
      const p = params.get("p");
      if (!p) return null;
      try { return extractSeedFromPath(decodeURIComponent(p)); } 
      catch { return null; }
    }

    function updateURL(seed, push = false) {
      const url = "/" + displaySeed(seed);
      if (push) history.pushState({ seed }, "", url);
      else history.replaceState({ seed }, "", url);
    }
    
    function updateFavicon(canvas) {
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
          link = document.createElement('link');
          link.rel = 'icon';
          document.head.appendChild(link);
      }
      link.href = canvas.toDataURL("image/png");
    }

    // Hehehe
    function createHumanAlien(seed) {
        const alien = {
            seed: seed,
            genome: {
                mass: 15000,
                bodyPlan: 'Biped',
                bodyLength: 1.5,
                bodyWidth: 0.5,
                limbPairsRaw: 0.5,
                legLengthRaw: 0.78,
                stanceRaw: 0.42,
                headSize: 1.0,
                headWidth: 1.0,
                snoutLengthRaw: 0.08,
                jawDepthRaw: 0.22,
                chinTaper: 0.45,
                headTilt: 0.0,
                neckLengthRaw: 0.34,
                eyeCount: 2,
                mouthType: 'Jaw',
                tailLength: 0.0,
                tailType: 'None',
                spineCurve: -0.15, 
                skinHue: 0.05,
                skinBrightness: 0.8,
                skinPattern: 0.1,
                patternStyle: 0.5,
                patternContrast: 0.0,
                paletteScheme: 'monochrome',
                accentHueOffset: 0.0,
                asymmetry: 0.05,
                asymmetryBias: 1,
                pupilType: 'round',
                niche: 'Omnivore',
                eyePlacement: 'Forward',
                posture: 'upright',
                jawDepth: 0.38,
                snoutLength: 0.22,
                neckLength: 0.95,
                neckThickness: 0.92,
                legLength: 66,
                legThickness: 9.8,
                jointRadius: 5.2,
                socketOutward: 11,
                limbRootOffset: 4.8,
                shoulderWidthScale: 1.06,
                tailBaseThickness: 0,
                tailSegmentFactor: 0.8
            },
            eyeClusterStyle: "Horizontal",
            registry: {
                curiosity: 2.65,
                watchfulness: 0.45,
                objectInterest: 2.35,
                physicalSignature: 0.4875
            },
            facts: {
                bodyPlan: "Biped",
                size: "Medium",
                diet: "Omnivore",
                vision: "Forward Vision",
                locomotion: "Walking",
                temperament: "Skittish"
            },
            geometry: { allBones: [], eyePositions: [], head: {} },
            materials: {
                baseColorRGB: [224, 172, 148],
                accentColorRGB: [210, 160, 138],
                highlightColorRGB: [255, 220, 200],
                eyeColorRGB: [80, 120, 200],
                patternScaleMultiplier: 0.05
            },
            eyes: {
                eyeCount: 2, scleraVisible: true, irisRadius: 0.45, pupilRadius: 0.35,
                pupilType: "round", eyelidTop: 0.25, eyelidBottom: 0.25,
                socketDepth: 0.3, highlightStrength: 0.8, irisPattern: 0.3
            },
            trace: { derived: {
                physicalVector: [0.29, 0.26, 0.11, 0.50, 0.78, 0.42, 0.38, 0.37, 0.08, 0.22, 0.45, 0.50, 0.34, 0.00, 0.41],
                physicalKeys: [
                    'genome.mass', 'genome.bodyLength', 'genome.bodyWidth', 'genome.limbPairsRaw',
                    'genome.legLengthRaw', 'genome.stanceRaw', 'genome.headSize', 'genome.headWidth',
                    'genome.snoutLengthRaw', 'genome.jawDepthRaw', 'genome.chinTaper', 'genome.headTilt',
                    'genome.neckLengthRaw', 'genome.tailLength', 'genome.spineCurve'
                ]
            } }
        };

        alien.physicalVector = Array.from(alien.trace.derived.physicalVector);
        if (typeof RegistryEngine !== "undefined" && RegistryEngine.buildBehaviourVector) {
          alien.behaviourVector = RegistryEngine.buildBehaviourVector(alien);
        } else {
          alien.behaviourVector = { keys: ['curiosity','watchfulness','objectInterest'], vector: [alien.registry.curiosity, alien.registry.watchfulness, alien.registry.objectInterest] };
        }

        const h = alien.geometry;

        function mkCap(ax, ay, bx, by, r1, r2, op='smooth_add', k=4) {
            return {
                op, k,
                evaluate(px, py) {
                    const dx = bx - ax, dy = by - ay;
                    const L = Math.sqrt(dx * dx + dy * dy);
                    if (L === 0) return Math.hypot(px - ax, py - ay) - Math.max(r1, r2);
                    if (L <= Math.abs(r1 - r2)) return r1 > r2 ? Math.hypot(px - ax, py - ay) - r1 : Math.hypot(px - bx, py - by) - r2;
                    const dirX = dx / L, dirY = dy / L;
                    const tx = px - ax, ty = py - ay;
                    const y = tx * dirX + ty * dirY; const x = Math.abs(tx * -dirY + ty * dirX); 
                    const sinT = (r1 - r2) / L; const cosT = Math.sqrt(Math.max(0.0, 1.0 - sinT * sinT));
                    const proj = y * cosT - x * sinT;
                    if (proj <= 0.0) return Math.hypot(x, y) - r1;
                    if (proj >= L * cosT) return Math.hypot(x, y - L) - r2;
                    return x * cosT + y * sinT - r1;
                },
                bounds() { const r = Math.max(r1, r2); return { minX: Math.min(ax - r, bx - r), minY: Math.min(ay - r, by - r), maxX: Math.max(ax + r, bx + r), maxY: Math.max(ay + r, by + r) }; },
                translate(dx, dy) { ax += dx; ay += dy; bx += dx; by += dy; },
                scale(s) { ax *= s; ay *= s; bx *= s; by *= s; r1 *= s; r2 *= s; k *= s; },
                squeezeAxis(axis, factor, center) {
                    if (axis === 'x') { ax = center + (ax - center) * factor; bx = center + (bx - center) * factor; }
                    else { ay = center + (ay - center) * factor; by = center + (by - center) * factor; }
                }
            };
        }

        function mkSph(x, y, r, op='smooth_add', k=4) {
            return {
                op, k,
                evaluate(px, py) { return Math.hypot(px - x, py - y) - r; },
                bounds() { return { minX: x - r, minY: y - r, maxX: x + r, maxY: y + r }; },
                translate(dx, dy) { x += dx; y += dy; },
                scale(s) { x *= s; y *= s; r *= s; k *= s; },
                squeezeAxis(axis, factor, center) {
                    if (axis === 'x') x = center + (x - center) * factor;
                    else y = center + (y - center) * factor;
                }
            };
        }

        // Spine / Torso 
        h.allBones.push(mkCap(0, 10, 0, 35, 14, 11, 'smooth_add', 8)); // Chest to waist
        h.allBones.push(mkCap(0, 35, 0, 45, 11, 13, 'smooth_add', 6));

        // Head & Neck
        h.allBones.push(mkCap(0, 10, 0, -5, 5, 5, 'smooth_add', 4)); // Neck
        h.allBones.push(mkSph(0, -15, 11, 'smooth_add', 4)); 
        h.allBones.push(mkCap(0, -15, 0, -5, 11, 7, 'smooth_add', 4)); 

        h.head.headCenter = { x: 0, y: -12 };
        h.head.headR = 11;

        // Eyes
        const eyeR = 2.2;
        h.eyePositions.push({ x: -4, y: -13, radius: eyeR });
        h.eyePositions.push({ x: 4, y: -13, radius: eyeR });
        h.allBones.push(mkSph(-4, -13, eyeR * 1.3, 'subtract', 0));
        h.allBones.push(mkSph(4, -13, eyeR * 1.3, 'subtract', 0));

        // Arms
        h.allBones.push(mkCap(-14, 12, -22, 30, 4.5, 3.5, 'smooth_add', 3));
        h.allBones.push(mkCap(14, 12, 22, 30, 4.5, 3.5, 'smooth_add', 3));
        h.allBones.push(mkCap(-22, 30, -26, 50, 3.5, 2.5, 'smooth_add', 3));
        h.allBones.push(mkCap(22, 30, 26, 50, 3.5, 2.5, 'smooth_add', 3));

        // Legs
        h.allBones.push(mkCap(-6, 42, -9, 75, 6, 4.5, 'smooth_add', 4));
        h.allBones.push(mkCap(6, 42, 9, 75, 6, 4.5, 'smooth_add', 4));
        h.allBones.push(mkCap(-9, 75, -9, 110, 4.5, 3, 'smooth_add', 4));
        h.allBones.push(mkCap(9, 75, 9, 110, 4.5, 3, 'smooth_add', 4));
        
        // Feet
        h.allBones.push(mkCap(-9, 110, -14, 113, 3, 2, 'smooth_add', 2));
        h.allBones.push(mkCap(9, 110, 14, 113, 3, 2, 'smooth_add', 2));

        return alien;
    }

    function drawEyes(ctx, eyeGenome, positions, skinColorRGB, eyeColorRGB) {
        if (eyeGenome.eyeCount === 0 || !positions) return;
        const [sR, sG, sB] = skinColorRGB;
        const [eR, eG, eB] = eyeColorRGB;

        for (const eye of positions) {
            const { x, y, radius } = eye;

            if (eyeGenome.socketDepth > 0.05) {
                ctx.save();
                ctx.globalAlpha = eyeGenome.socketDepth * 0.7;
                ctx.fillStyle = "rgb(0,0,0)";
                ctx.beginPath();
                ctx.ellipse(x, y + radius * 0.15, radius * 1.35, radius * 1.25, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.save();
            ctx.beginPath();
            const topCtrlY = y - radius * (2 - eyeGenome.eyelidTop * 4);
            const botCtrlY = y + radius * (2 - eyeGenome.eyelidBottom * 4);
            ctx.moveTo(x - radius, y);
            ctx.quadraticCurveTo(x, topCtrlY, x + radius, y);
            ctx.quadraticCurveTo(x, botCtrlY, x - radius, y);
            ctx.clip();

            const irisR = eyeGenome.scleraVisible ? radius * eyeGenome.irisRadius : radius * 0.98;
            ctx.fillStyle = eyeGenome.scleraVisible 
                ? `rgb(${Math.min(255, sR + 70)}, ${Math.min(255, sG + 65)}, ${Math.min(255, sB + 60)})`
                : `rgb(${eR | 0}, ${eG | 0}, ${eB | 0})`;
            ctx.fillRect(x - radius, y - radius, radius*2, radius*2);

            if (eyeGenome.scleraVisible) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, irisR, 0, Math.PI * 2);
                ctx.clip();
                ctx.fillStyle = `rgb(${eR | 0}, ${eG | 0}, ${eB | 0})`;
                ctx.fillRect(x - irisR, y - irisR, irisR * 2, irisR * 2);

                const streakCount = Math.round(2 + eyeGenome.irisPattern * 10);
                ctx.globalAlpha = 0.25 + eyeGenome.irisPattern * 0.35;
                ctx.strokeStyle = `rgb(${Math.max(0, eR - 60)}, ${Math.max(0, eG - 60)}, ${Math.max(0, eB - 60)})`;
                ctx.lineWidth = Math.max(0.6, irisR * 0.12);
                for (let s = 0; s < streakCount; s++) {
                    const a = (s / streakCount) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + Math.cos(a) * irisR, y + Math.sin(a) * irisR);
                    ctx.stroke();
                }
                ctx.restore();
            }

            const pupilR = irisR * eyeGenome.pupilRadius;
            ctx.fillStyle = "rgb(8,8,10)";
            ctx.beginPath();
            if (eyeGenome.pupilType === "slit") {
                ctx.ellipse(x, y, pupilR * 0.2, pupilR, 0, 0, Math.PI * 2);
            } else if (eyeGenome.pupilType === "horizontal") {
                ctx.ellipse(x, y, pupilR, pupilR * 0.3, 0, 0, Math.PI * 2);
            } else {
                ctx.arc(x, y, pupilR, 0, Math.PI * 2);
            }
            ctx.fill();

            const shadowGrad = ctx.createLinearGradient(x - radius, y - radius, x + radius, y + radius);
            shadowGrad.addColorStop(0, "rgba(255,255,255,0.4)"); 
            shadowGrad.addColorStop(0.4, "rgba(0,0,0,0)");
            shadowGrad.addColorStop(1, "rgba(0,0,0,0.85)"); 
            ctx.fillStyle = shadowGrad;
            ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);

            ctx.globalAlpha = eyeGenome.highlightStrength;
            ctx.fillStyle = "rgb(255,255,255)";
            ctx.beginPath();
            ctx.arc(x - pupilR * 0.4, y - pupilR * 0.4, Math.max(0.8, pupilR * 0.3), 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            ctx.strokeStyle = `rgb(${Math.max(0, sR - 30)}, ${Math.max(0, sG - 30)}, ${Math.max(0, sB - 30)})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - radius, y);
            ctx.quadraticCurveTo(x, topCtrlY, x + radius, y);
            ctx.quadraticCurveTo(x, botCtrlY, x - radius, y);
            ctx.stroke();
        }
    }

    function renderAlien(canvasId, seed) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return null;
      resizeCanvasToDisplaySize(canvas);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const numSeed = parseInt(seed, 10);
      
      let alien;
      if (numSeed === HUMAN_SEED) {
          alien = createHumanAlien(numSeed);
      } else {
          alien = AlienEngine.generate(numSeed);
      }

      AlienEngine.fitToBounds(alien, canvas.width, canvas.height, smartPadding(alien, canvas));

      const allBones = alien.geometry.allBones;
      const head = alien.geometry.head;
      const eyePositions = alien.geometry.eyePositions;
      const [baseR, baseG, baseB] = alien.materials.baseColorRGB;
      const [accR, accG, accB] = alien.materials.accentColorRGB;
      const [hiR, hiG, hiB] = alien.materials.highlightColorRGB;
      const eyeColorRGB = alien.materials.eyeColorRGB;
      
      const imgData = ctx.createImageData(canvas.width, canvas.height);
      const data = imgData.data;
      const eps = 1.0;
      
      const patType = alien.genome.skinPattern;
      const patStyle = alien.genome.patternStyle;
      const patContrast = alien.genome.patternContrast;
      const patScale = alien.materials.patternScaleMultiplier * (1 + patType * 2);

      const lx = -0.5, ly = -0.5, lz = 0.8;
      const flx = 0.65, fly = 0.45, flz = 0.35;

      const fbm2D = (x, y, octaves) => {
          let amp = 0.5, freq = 1, sum = 0, norm = 0;
          for (let i = 0; i < octaves; i++) {
              sum += amp * AlienEngine.noise2D(x * freq, y * freq);
              norm += amp; amp *= 0.5; freq *= 2.15;
          }
          return sum / norm;
      };

      const computePatternMod = (px, py) => {
          if (patType < 0.25) { 
              const n = fbm2D(px * patScale, py * patScale, 3);
              const thresh = 0.55 + patStyle * 0.15;
              return n > thresh ? Math.min(1, (n - thresh) * 5) : 0;
          }
          if (patType < 0.5) { 
              const warp = fbm2D(px * patScale * 0.4, py * patScale * 0.4, 2) * 6;
              const s = Math.sin(px * patScale * (2 + patStyle * 4) + warp);
              return s > 0.25 ? Math.min(1, (s - 0.25) * 2) : 0;
          }
          if (patType < 0.75) { 
              const freq = patScale * (2.2 + patStyle * 1.5);
              const row = Math.floor(py * freq);
              const rowOffset = (row % 2) * 0.5;
              const col = Math.floor(px * freq + rowOffset);
              const fx = (px * freq + rowOffset) - col - 0.5;
              const fy = (py * freq) - row - 0.5;
              let cellHash = Math.sin(col * 12.9898 + row * 78.233) * 43758.5453;
              cellHash -= Math.floor(cellHash);
              const edge = 1 - Math.min(1, Math.hypot(fx, fy) * 1.8);
              return cellHash > 0.4 ? Math.max(0, edge) : 0;
          }
          return fbm2D(px * patScale, py * patScale, 4);
      };

      for (let py = 0; py < canvas.height; py++) {
        for (let px = 0; px < canvas.width; px++) {
          const d = AlienEngine.evaluateField(px, py, allBones);
          
          if (d < 1.0) {
            const idx = (py * canvas.width + px) * 4;
            const alpha = Math.max(0, Math.min(1, 1.0 - d));
            
            const dx = AlienEngine.evaluateField(px + eps, py, allBones) - d;
            const dy = AlienEngine.evaluateField(px, py + eps, allBones) - d;
            const nz = 1.5;
            const nLen = Math.hypot(dx, dy, nz);
            const nx = dx / nLen, ny = dy / nLen, normZ = nz / nLen;
            
            const dot = Math.max(0, nx * lx + ny * ly + normZ * lz);
            let intensity = 0.25 + dot * 0.75;

            const fillDot = Math.max(0, nx * flx + ny * fly + normZ * flz);
            const fill = fillDot * 0.16;

            if(head.headCenter && head.headR) {
              const distToHead = Math.hypot(px - head.headCenter.x, py - head.headCenter.y);
              const headGlow = Math.max(0, 1.0 - distToHead / (head.headR * 3.5)) * 0.15;
              intensity += headGlow;
            }

            const patternMod = computePatternMod(px, py) * patContrast;

            const pR = baseR * (1 - patternMod) + accR * patternMod;
            const pG = baseG * (1 - patternMod) + accG * patternMod;
            const pB = baseB * (1 - patternMod) + accB * patternMod;

            data[idx] = Math.min(255, pR * intensity + hiR * fill);
            data[idx + 1] = Math.min(255, pG * intensity + hiG * fill);
            data[idx + 2] = Math.min(255, pB * intensity + hiB * fill);
            data[idx + 3] = alpha * 255;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      drawEyes(ctx, alien.eyes, eyePositions, [baseR, baseG, baseB], eyeColorRGB);
      updateFavicon(canvas);

      return alien;
    }

    const SharedTraitMap = {
        "Similar mass": "Similar body proportions",
        "Similar body length": "Similar body proportions",
        "Similar body width": "Similar body proportions",
        "Similar limb count": "Similar limb structure",
        "Similar leg length": "Similar limb structure",
        "Similar stance": "Similar posture",
        "Similar head size": "Similar head profile",
        "Similar head width": "Similar head profile",
        "Similar snout length": "Similar head profile",
        "Similar jaw depth": "Similar head profile",
        "Similar chin taper": "Similar head profile",
        "Similar head tilt": "Similar posture",
        "Similar neck length": "Similar neck length",
        "Similar tail length": "Similar tail length",
        "Similar spine curvature": "Similar posture"
    };

    function sectionBlock(name, innerHtml) {
      const state = getCollapsedState();
      const collapsed = !!state[name];
      const chev = collapsed ? "▶" : "▼";
      return `
        <div class="data-section" data-section="${name}">
          <span class="data-header" data-toggle-section="${name}"><span class="chev">${chev}</span>${name}</span>
          <div class="section-body${collapsed ? " collapsed" : ""}"><div class="section-body-inner">${innerHtml}</div></div>
        </div>
      `;
    }

    function buildDataHTML(alien, seed) {
        const numSeed = parseInt(seed, 10);
        
        initializeLocalDB();
        prepareEntity(alien, numSeed);
        const currentDB = [...localDB, alien];
        
        const g = alien.genome;
        const reg = alien.registry;
        const facts = alien.facts;

        let fingerprint = "UNKNOWN";
        let closestSeedNum = null;
        let closestFingerprint = "UNKNOWN";
        let similarityScore = 0;
        let rawSharedTraits = [];

        if (typeof RegistryEngine !== 'undefined') {
            try {
                fingerprint = RegistryEngine.buildFingerprint(alien);
                closestSeedNum = RegistryEngine.findClosestOverall(numSeed, currentDB);
                const closestEntity = currentDB.find(a => a.seed === closestSeedNum);
                
                if (closestEntity) {
                    closestFingerprint = RegistryEngine.buildFingerprint(closestEntity);
                    similarityScore = RegistryEngine.computeSimilarity(alien, closestEntity).overall;
                    rawSharedTraits = RegistryEngine.computeSharedTraits(alien, closestEntity);
                }
            } catch (e) {}
        }
        
        const mappedTraits = rawSharedTraits.map(t => SharedTraitMap[t] || t);
        const uniqueTraits = [...new Set(mappedTraits)].slice(0, 3);

        const nCur = clamp((reg.curiosity + 0.4) / 2.8, 0, 1);
        const nWat = clamp((reg.watchfulness - 0.2) / 2.0, 0, 1);
        const nInt = clamp((reg.objectInterest - 0.25) / 2.6, 0, 1);

        const states = {
            explorationDrive: 0.5 * nCur + 0.5 * nInt,
            caution: nWat,
            boldness: 1.0 - nWat,
            fixation: nInt,
            volatility: Math.abs(nCur - nWat),
            environmentalAttachment: 0.6 * nInt + 0.4 * reg.physicalSignature,
            diet: facts.diet,
            size: facts.size,
            locomotion: facts.locomotion,
            temperament: facts.temperament
        };

        const observations = (typeof ObservationEngine !== "undefined" && ObservationEngine.getPool)
          ? ObservationEngine.getPool(alien, states, null)
          : [];

        if (typeof RegistryEngine !== "undefined" && RegistryEngine.summarizeMorphologyObservations) {
          try {
            const extra = RegistryEngine.summarizeMorphologyObservations(alien) || [];
            extra.forEach((t, i) => observations.push({ section: 'MORPHOLOGY', cond: () => true, cert: 0.82 - i * 0.06, text: t }));
          } catch {}
        }

        const validObs = observations.filter(o => o.cond());

        const selections = {
            'MORPHOLOGY': selectN(seed, "morph", validObs.filter(o => o.section === 'MORPHOLOGY'), 3 + Math.floor(detHash(seed, "mC") * 2)),
            'BEHAVIOUR': selectN(seed, "behav", validObs.filter(o => o.section === 'BEHAVIOUR'), 4 + Math.floor(detHash(seed, "bC") * 2)),
            'ECOLOGY': selectN(seed, "eco", validObs.filter(o => o.section === 'ECOLOGY'), 3 + Math.floor(detHash(seed, "eC") * 2)),
            'OBSERVATIONS': selectN(seed, "obs", validObs.filter(o => o.section === 'OBSERVATIONS'), 4 + Math.floor(detHash(seed, "oC") * 2))
        };

        let html = '';

        let distinguishing = "";
        if (typeof ObservationEngine !== "undefined" && ObservationEngine.getDistinguishing) {
          try { distinguishing = ObservationEngine.getDistinguishing(alien) || ""; } catch {}
        }

        const identityInner = `
          <div class="data-entry seed-row">
            <span class="entry-label">Entity Seed:</span> <span id="seedValue">${displaySeed(numSeed)}</span>
            <button class="copy-btn" id="copySeedBtn" type="button" aria-label="Copy seed">${COPY_ICON}</button>
          </div>
          <div class="data-entry"><span class="entry-label">Registry ID:</span> <span class="registry-id">${numSeed === HUMAN_SEED ? 'REG-H0M0S4P' : fingerprint}</span></div>
          ${distinguishing ? `<div class="data-entry"><span class="entry-label">Distinguishing Trait:</span> ${distinguishing}</div>` : ""}
        `;
        html += sectionBlock("IDENTITY", identityInner);

        const renderOrder = ['MORPHOLOGY', 'BEHAVIOUR', 'ECOLOGY', 'OBSERVATIONS'];
        renderOrder.forEach(sec => {
            if (selections[sec] && selections[sec].length > 0) {
                const inner = selections[sec].map(item => {
                    const conf = getConf(item.cert);
                    return `<div class="data-entry"><span class="entry-confidence">${conf}</span> ${item.text}</div>`;
                }).join("");
                html += sectionBlock(sec, inner);
            }
        });

        let sharedText = uniqueTraits.length > 0 
            ? uniqueTraits.map(t => `<br>&nbsp;&nbsp;• ${t}`).join('') 
            : "<br>&nbsp;&nbsp;• Insufficient baseline overlap";

        if (closestSeedNum !== null) {
            const simPct = (similarityScore * 100).toFixed(1);
            const similarInner = `
                <div class="data-entry"><span class="entry-label">Entity Seed:</span> ${makeSeedLink(closestSeedNum)}</div>
                <div class="data-entry"><span class="entry-label">Registry ID:</span> <span class="registry-id">${closestFingerprint}</span></div>
                <div class="data-entry"><span class="entry-label">Estimated Similarity:</span> ${simPct}%</div>
                <div class="data-entry"><span class="entry-label">Shared Traits:</span>${sharedText}</div>
            `;
            html += sectionBlock("LOCAL ANALYSIS", similarInner);
        } else {
            html += sectionBlock("LOCAL ANALYSIS", `<div class="data-entry"><span class="entry-label">Status:</span> Search unavailable or local cache empty.</div>`);
        }

        document.getElementById("alienData").innerHTML = html;

        const copyBtn = document.getElementById("copySeedBtn");
        if (copyBtn) {
          copyBtn.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(displaySeed(numSeed));
              copyBtn.innerHTML = CHECK_ICON;
              copyBtn.classList.add("copied");
              setTimeout(() => {
                copyBtn.innerHTML = COPY_ICON;
                copyBtn.classList.remove("copied");
              }, 1000);
            } catch {}
          });
        }

        document.querySelectorAll("[data-toggle-section]").forEach(el => {
          el.addEventListener("click", () => toggleSection(el.getAttribute("data-toggle-section")));
        });

        document.querySelectorAll("[data-seed-link]").forEach(el => {
          el.addEventListener("click", () => {
            const s = el.getAttribute("data-seed-link");
            if (s != null) newAlien("url", s);
          });
        });
    }

    function newAlien(mode = "input", urlSeed = null) {
      const dataEl = document.getElementById("alienData");
      const input = document.getElementById("seedInput");
      dataEl.textContent = "Interfacing with telemetry archive...";

      requestAnimationFrame(() => {
        let seed = null;

        if (urlSeed != null) seed = normalizeSeedString(urlSeed);
        else if (mode === "random") seed = randomSeedString();
        else seed = normalizeSeedString(input.value) || randomSeedString();

        input.value = displaySeed(seed);

        const push = mode === "random";
        updateURL(seed, push);

        currentRenderedSeed = seed;
        const alien = renderAlien("alienCanvas", seed);
        buildDataHTML(alien, seed);
      });
    }

    window.addEventListener("load", () => {
      requestAnimationFrame(() => {
        const seedFromUrl =
          extractSeedFromPath(window.location.pathname) ||
          getSeedFromRedirectParam();

        if (seedFromUrl) {
          newAlien("url", seedFromUrl);
          history.replaceState({ seed: seedFromUrl }, "", "/" + displaySeed(seedFromUrl));
        } else {
          newAlien("random");
        }
      });
    });

    window.addEventListener("resize", () => {
      if (currentRenderedSeed != null) {
        requestAnimationFrame(() => {
          const alien = renderAlien("alienCanvas", currentRenderedSeed);
          buildDataHTML(alien, currentRenderedSeed);
        });
      }
    });

    window.addEventListener("popstate", (event) => {
      if (event.state && event.state.seed) {
        newAlien("url", event.state.seed);
        return;
      }
      const seedFromUrl =
        extractSeedFromPath(window.location.pathname) ||
        getSeedFromRedirectParam();

      if (seedFromUrl) {
          newAlien("url", seedFromUrl);
          history.replaceState({ seed: seedFromUrl }, "", "/" + displaySeed(seedFromUrl));
      } else {
          newAlien("random");
      }
    });

    document.getElementById("generateBtn").addEventListener("click", () => newAlien("input"));

    document.getElementById("seedInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        newAlien("input");
        this.blur();
      }
    });

    document.getElementById("alienCanvas").addEventListener("click", () => {
      document.getElementById("seedInput").value = "";
      newAlien("random");
    });
  </script>
</body>
</html>
