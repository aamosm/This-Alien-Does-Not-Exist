<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>

<script>
(function () {

    const params = new URLSearchParams(location.search);


    if (params.has("p")) {
        location.replace("/" + location.search);
        return;
    }

    location.replace(
        "/?p=" +
        encodeURIComponent(
            location.pathname +
            location.search +
            location.hash
        )
    );

})();
</script>

</head>
<body></body>
</html>
